[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verified-examples"
version = "0.1.0"
description = "Documentation examples an agent can check instead of recalling."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antoni Jagodka", email = "tjagodka@gmail.com" }]
keywords = ["supply-chain", "provenance", "in-toto", "attestation", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DrVelvetFog/verified-examples"
Source = "https://github.com/DrVelvetFog/verified-examples"
Specification = "https://github.com/DrVelvetFog/verified-examples/blob/main/SPEC.md"

[project.scripts]
xv = "verified_examples:main"

# The tool is a single stdlib-only file named `xv` at the repository root, kept
# executable so `./xv` works from a clone. force-include ships that exact file as
# the module `verified_examples` in the wheel, so the published package and the
# repository never drift apart and nothing needed moving to package it.
[tool.hatch.build.targets.wheel.force-include]
"xv" = "verified_examples.py"

[tool.hatch.build.targets.sdist]
include = ["xv", "SPEC.md", "README.md", "LICENSE", "examples/", "pyproject.toml"]
